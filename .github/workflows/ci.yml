name: CI
concurrency:
  group: practice-desk-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Pass 15 renders the frozen baseline/v11 single-file artifact.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: node scripts/smoke-offline.mjs
      - run: node scripts/pass18-targeted.mjs
      - run: node scripts/pass19-targeted.mjs
      - run: node scripts/pass20-targeted.mjs
      - run: node scripts/pass21-targeted.mjs
      - run: node scripts/pass22-targeted.mjs
      - run: node scripts/pass23-independent.mjs
      - run: node scripts/pass25-library.mjs
      - run: node scripts/pass26-exam.mjs
      - run: node scripts/pass27-history-results.mjs
      - name: Save paired v11 and overhaul History/Results laptop landmarks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass27-history-results-first-fold
          path: artifacts/pass27-history-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Save v11 versus overhaul laptop Exam geometry and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass26-exam-first-fold-screenshots
          path: artifacts/pass26-exam/
          if-no-files-found: warn
          retention-days: 30
      - name: Save v11 versus overhaul laptop Library geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass25-library-action-first-screenshots
          path: artifacts/pass25-library/
          if-no-files-found: warn
          retention-days: 30
      - run: node scripts/pass11-parity.mjs
      - run: node scripts/pass12-parity.mjs
      - run: node scripts/pass13-history.mjs
      - run: node scripts/pass14-parity.mjs
      - run: node scripts/pass15-visual.mjs
      - name: Capture independent laptop-size v11 / overhaul screenshots and landmarks
        env:
          PASS15_OUTPUT: artifacts/pass24-laptop/
          PASS15_VIEWPORTS: '[{"name":"laptop1366","width":1366,"height":768},{"name":"laptop1440","width":1440,"height":900},{"name":"laptop1536","width":1536,"height":864}]'
        run: node scripts/pass15-visual.mjs
      - name: Save laptop screenshot comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass24-laptop-v11-overhaul-visual-evidence
          path: artifacts/pass24-laptop/
          if-no-files-found: warn
          retention-days: 30
      - name: Save visual comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass15-v11-overhaul-visual-evidence
          path: artifacts/pass15-visual/
          if-no-files-found: warn
          retention-days: 30
      - run: node scripts/pass16-independent.mjs
      - run: node scripts/pass10-platform.mjs chromium
      # On the development branch, publish the generated single-file distribution
      # only after all tests pass. main and baseline/v11 are never written.
      - name: Commit verified offline distribution
        if: github.event_name == 'push' && github.ref == 'refs/heads/overhaul'
        run: |
          if ! git diff --quiet -- Practice_Desk_Offline_Mock_Tests.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Practice_Desk_Offline_Mock_Tests.html
            git commit -m 'build: refresh verified offline HTML [skip ci]'
            git push origin HEAD:overhaul
          fi
      - run: git diff --exit-code -- Practice_Desk_Offline_Mock_Tests.html

  cross-browser:
    name: Offline acceptance (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: node node_modules/playwright-core/cli.js install --with-deps ${{ matrix.browser }}
      - run: npm run check
      - run: node scripts/pass10-platform.mjs ${{ matrix.browser }}
