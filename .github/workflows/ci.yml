name: CI
on:
  push:
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
concurrency:
  group: practice-desk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  core:
    name: Strict TypeScript, build and Node contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      # Node 26.13.0 LTS; committed lockfile fixes direct and transitive resolution.
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Verify retained tests detect each targeted isolated semantic mutation
        run: node scripts/mutation-sensitivity.mjs
      - name: Prove clean locked dependency graph and deterministic HTML rebuild
        shell: bash
        run: |
          set -euo pipefail
          npm ls --all --parseable > /dev/null
          before=$(sha256sum Practice_Desk_Offline_Mock_Tests.html | cut -d' ' -f1)
          npm run build
          after=$(sha256sum Practice_Desk_Offline_Mock_Tests.html | cut -d' ' -f1)
          test "$before" = "$after" || { echo "::error::Non-reproducible HTML build"; exit 1; }
          echo "P42 verified deterministic HTML SHA-256 $after"
      - name: Save source-verified standalone HTML
        if: github.event_name == 'push' && github.ref == 'refs/heads/working'
        uses: actions/upload-artifact@v4
        with:
          name: source-verified-offline-html
          path: Practice_Desk_Offline_Mock_Tests.html
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  optimizer-runtime:
    name: Exercise beta FSRS optimizer runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Install isolated optimizer bindings from committed lock
        run: npm ci --prefix tools/fsrs-optimizer --no-audit --no-fund
      - name: Prove isolated optimizer dependency graph is lock-clean
        run: npm ls --prefix tools/fsrs-optimizer --all --parseable > /dev/null
      - name: Run FSRS-7 native optimizer, chronology and step-analysis smoke
        run: npm run --prefix tools/fsrs-optimizer smoke
      - name: Compare native and WASM optimizer semantics
        run: npm run --prefix tools/fsrs-optimizer parity
      - name: Build static app with browser FSRS Worker/WASM
        run: npm run build:static
      - name: Save source-verified static app
        uses: actions/upload-artifact@v4
        with:
          name: source-verified-static-app
          path: Practice_Desk_Static/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  chromium:
    name: Complete offline Chromium candidate journeys
    needs: [core, optimizer-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: source-verified-static-app
          path: Practice_Desk_Static
      - run: npm run build
      - name: All 32 source-mapped journeys in one browser process
        run: node scripts/acceptance-suite.mjs chromium
      - name: Complete browser/WASM FSRS optimizer activation pipeline
        run: node scripts/fsrs-browser-optimizer-smoke.mjs chromium full
      - name: Upload failures only, including runner's per-journey report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-failure-evidence
          path: |
            artifacts/acceptance-modern/
            artifacts/p58a-integrity/
            artifacts/p58b-editorial/
            artifacts/p58c-scale/
            artifacts/p47-5c-visual/
            artifacts/p47-5d-publish/
            artifacts/p54-authoring/
            artifacts/p53-taxonomy/
          if-no-files-found: ignore
          retention-days: 7

  cross-browser:
    name: Complete offline Firefox/WebKit candidate journeys (${{ matrix.browser }})
    needs: [core, optimizer-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: node node_modules/playwright-core/cli.js install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@v4
        with:
          name: source-verified-static-app
          path: Practice_Desk_Static
      - run: npm run build
      - name: All 20 source-mapped journeys in one browser process
        run: node scripts/acceptance-suite.mjs ${{ matrix.browser }}
      - name: Browser/WASM FSRS optimizer probe
        run: node scripts/fsrs-browser-optimizer-smoke.mjs ${{ matrix.browser }}
      - name: Upload failures only, including runner's per-journey report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.browser }}-failure-evidence
          path: |
            artifacts/acceptance-modern/
            artifacts/p58a-integrity/
            artifacts/p58b-editorial/
            artifacts/p58c-scale/
            artifacts/p47-5c-visual/
            artifacts/p47-5d-publish/
            artifacts/p54-authoring/
            artifacts/p53-taxonomy/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish only after all current-app gates pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/working'
    needs: [core, optimizer-runtime, chromium, cross-browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: source-verified-offline-html
          path: .verified-build
      - name: Reject source drift and publish the tested HTML if needed
        shell: bash
        run: |
          set -euo pipefail
          verified_head="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$verified_head"
          test -s .verified-build/Practice_Desk_Offline_Mock_Tests.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          target_branch="${GITHUB_REF_NAME}"
          case "$target_branch" in
            working) ;;
            *) echo "::error::Unauthorized guarded publisher branch"; exit 1 ;;
          esac
          git fetch origin "$target_branch"
          remote_head=$(git rev-parse FETCH_HEAD)
          git merge-base --is-ancestor "$verified_head" "$remote_head" || {
            echo "::error::Branch diverged from tested source"; exit 1;
          }
          source_changes=$(git diff --name-only "$verified_head" "$remote_head" | grep -vE '\.md$' || true)
          test -z "$source_changes" || {
            echo "::error::Source, CI or artifact changed after testing: $source_changes"; exit 1;
          }
          cp .verified-build/Practice_Desk_Offline_Mock_Tests.html Practice_Desk_Offline_Mock_Tests.html
          if git diff --quiet -- Practice_Desk_Offline_Mock_Tests.html; then
            echo "Verified build matches committed offline HTML."
            exit 0
          fi
          git add Practice_Desk_Offline_Mock_Tests.html
          git commit -m 'build: refresh verified offline HTML [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin "$target_branch"
            remote_head=$(git rev-parse FETCH_HEAD)
            git merge-base --is-ancestor "$verified_head" "$remote_head" || {
              echo "::error::Branch diverged after testing"; exit 1;
            }
            source_changes=$(git diff --name-only "$verified_head" "$remote_head" | grep -vE '\.md$' || true)
            test -z "$source_changes" || {
              echo "::error::Unverified branch changes: $source_changes"; exit 1;
            }
            git rebase "$remote_head"
            if git push origin "HEAD:$target_branch"; then exit 0; fi
          done
          echo "::error::Could not safely publish tested HTML"; exit 1
