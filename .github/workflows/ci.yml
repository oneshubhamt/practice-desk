name: CI
on:
  push:
  pull_request:
concurrency:
  group: practice-desk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  core:
    name: Strict TypeScript, build and Node contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      # Node 24 + npm 11; committed lockfile fixes direct and transitive resolution.
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Prove clean locked dependency graph and deterministic HTML rebuild
        shell: bash
        run: |
          set -euo pipefail
          npm ls --all --parseable > /dev/null
          before=$(sha256sum Practice_Desk_Offline_Mock_Tests.html | cut -d' ' -f1)
          npm run build
          after=$(sha256sum Practice_Desk_Offline_Mock_Tests.html | cut -d' ' -f1)
          test "$before" = "$after" || { echo "::error::Non-reproducible HTML build"; exit 1; }
          echo "P42 verified deterministic HTML SHA-256 $after"
      - name: Save source-verified standalone HTML
        if: github.event_name == 'push' && github.ref == 'refs/heads/overhaul'
        uses: actions/upload-artifact@v4
        with:
          name: source-verified-offline-html
          path: Practice_Desk_Offline_Mock_Tests.html
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  chromium:
    name: Modern offline browser journeys and unique safety checks
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: P47-5B actual offline mathematical question/review and font safety (Chromium)
        run: node scripts/acceptance-p47-math.mjs chromium
      - run: node scripts/acceptance-history-evidence.mjs
      - run: node scripts/acceptance-history-filters.mjs
      - run: node scripts/acceptance-resilience.mjs
      - run: node scripts/acceptance-learning-lifecycle.mjs
      - run: node scripts/acceptance-session-policy.mjs
      - run: node scripts/acceptance-editorial-provenance.mjs
      - name: P47-3 real offline modal, answer isolation, pan/zoom and focus (Chromium)
        run: node scripts/acceptance-image-viewer.mjs
      - name: P47-3B optional local image preparation and authored bank integrity
        run: node scripts/acceptance-image-preparation.mjs
      - name: P47-5C integrated Wordgard authoring, visual and offline QA (Chromium)
        run: node scripts/acceptance-authoring-visual.mjs chromium
      - run: node scripts/acceptance-critical.mjs
      - run: node scripts/acceptance-bank-modes.mjs
      - run: node scripts/acceptance-drafts.mjs
      - run: node scripts/acceptance-recovery.mjs
      - run: node scripts/acceptance-ui.mjs
      - run: node scripts/acceptance-stress.mjs
      - name: Profile real frozen storage at 0, 100, 1000 and 1600 records
        run: node scripts/benchmark-storage.mjs
      - name: P47-0 reproducible UI/focus/DOM baseline (diagnostic; no speed thresholds)
        run: node scripts/benchmark-ui-coordinator.mjs
      - name: Preserve P47-0 machine-readable baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p47-0-ui-baseline
          path: artifacts/p47-baseline/*.json
          if-no-files-found: ignore
          retention-days: 14
      - run: node scripts/acceptance-platform.mjs chromium
      - run: node scripts/acceptance-safari-fallback.mjs chromium
      # All current browser functional contracts live in the capability suites.
      - name: P47-5C reviewable targeted authoring screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p47-5c-visual-qa-chromium
          path: artifacts/p47-5c-visual/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload screenshots only when a modern test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: artifacts/acceptance-modern/
          if-no-files-found: ignore
          retention-days: 7

  cross-browser:
    name: Offline persistence and navigation (${{ matrix.browser }})
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: node node_modules/playwright-core/cli.js install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - name: P47-5B actual offline mathematical question/review and font safety (${{ matrix.browser }})
        run: node scripts/acceptance-p47-math.mjs ${{ matrix.browser }}
      - run: node scripts/acceptance-platform.mjs ${{ matrix.browser }}
      - run: node scripts/acceptance-safari-fallback.mjs ${{ matrix.browser }}
      - name: P47-3 real image dialog (${{ matrix.browser }})
        run: node scripts/acceptance-image-viewer.mjs ${{ matrix.browser }}
      - name: P47-3B offline import image preparation (${{ matrix.browser }})
        run: node scripts/acceptance-image-preparation.mjs ${{ matrix.browser }}
      - name: P47-5C Wordgard authoring visual QA (${{ matrix.browser }})
        run: node scripts/acceptance-authoring-visual.mjs ${{ matrix.browser }}
      - name: Preserve targeted authoring screenshots (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p47-5c-visual-qa-${{ matrix.browser }}
          path: artifacts/p47-5c-visual/*.png
          if-no-files-found: ignore
          retention-days: 7
      # WebKit native Back after file:// reload remains explicitly unsupported.

  publish:
    name: Publish only after all current-app gates pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/overhaul'
    needs: [core, chromium, cross-browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: source-verified-offline-html
          path: .verified-build
      - name: Reject source drift and publish the tested HTML if needed
        shell: bash
        run: |
          set -euo pipefail
          verified_head="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$verified_head"
          test -s .verified-build/Practice_Desk_Offline_Mock_Tests.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin overhaul
          remote_head=$(git rev-parse FETCH_HEAD)
          git merge-base --is-ancestor "$verified_head" "$remote_head" || {
            echo "::error::Branch diverged from tested source"; exit 1;
          }
          source_changes=$(git diff --name-only "$verified_head" "$remote_head" | grep -vE '\.md$' || true)
          test -z "$source_changes" || {
            echo "::error::Source, CI or artifact changed after testing: $source_changes"; exit 1;
          }
          cp .verified-build/Practice_Desk_Offline_Mock_Tests.html Practice_Desk_Offline_Mock_Tests.html
          if git diff --quiet -- Practice_Desk_Offline_Mock_Tests.html; then
            echo "Verified build matches committed offline HTML."
            exit 0
          fi
          git add Practice_Desk_Offline_Mock_Tests.html
          git commit -m 'build: refresh verified offline HTML [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin overhaul
            remote_head=$(git rev-parse FETCH_HEAD)
            git merge-base --is-ancestor "$verified_head" "$remote_head" || {
              echo "::error::Branch diverged after testing"; exit 1;
            }
            source_changes=$(git diff --name-only "$verified_head" "$remote_head" | grep -vE '\.md$' || true)
            test -z "$source_changes" || {
              echo "::error::Unverified branch changes: $source_changes"; exit 1;
            }
            git rebase "$remote_head"
            if git push origin HEAD:overhaul; then exit 0; fi
          done
          echo "::error::Could not safely publish tested HTML"; exit 1
