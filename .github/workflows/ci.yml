name: CI
on:
  push:
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
concurrency:
  group: practice-desk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  fast:
    name: Fast — type, build, contracts and optimizer smoke
    runs-on: ubuntu-latest
    env:
      QA_TIMING_FILE: artifacts/qa-timing/fast.jsonl
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Fast Node/type/build contracts
        run: node scripts/timed-run.mjs fast-node -- npm run qa:fast
      - name: Prove clean locked dependency graph and deterministic HTML rebuild
        shell: bash
        run: |
          set -euo pipefail
          npm ls --all --parseable > /dev/null
          before=$(sha256sum Practice_Desk_Offline_Mock_Tests.html | cut -d' ' -f1)
          npm run build
          after=$(sha256sum Practice_Desk_Offline_Mock_Tests.html | cut -d' ' -f1)
          test "$before" = "$after" || { echo "::error::Non-reproducible HTML build"; exit 1; }
          echo "Verified deterministic HTML SHA-256 $after"
      - name: Install isolated optimizer bindings
        run: npm ci --prefix tools/fsrs-optimizer --no-audit --no-fund
      - name: Prove isolated optimizer dependency graph is lock-clean
        run: npm ls --prefix tools/fsrs-optimizer --all --parseable > /dev/null
      - name: Native FSRS optimizer smoke
        run: node scripts/timed-run.mjs optimizer-smoke -- npm run --prefix tools/fsrs-optimizer smoke
      - name: Build static Worker/WASM app
        run: node scripts/timed-run.mjs static-build -- npm run build:static
      - uses: actions/upload-artifact@v4
        with:
          name: source-verified-offline-html
          path: Practice_Desk_Offline_Mock_Tests.html
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: source-verified-static-app
          path: Practice_Desk_Static/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
      - name: Upload fast timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-timing-fast
          path: artifacts/qa-timing/
          if-no-files-found: ignore
          retention-days: 7

  smoke:
    name: Smoke — critical Chromium user journeys
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_TIMING_FILE: artifacts/qa-timing/smoke.jsonl
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: source-verified-offline-html
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: source-verified-static-app
          path: Practice_Desk_Static
      - name: Six critical Chromium smoke scenarios
        run: node scripts/timed-run.mjs browser-smoke -- node scripts/acceptance-suite.mjs chromium --tag=smoke
      - name: Browser/WASM optimizer activation
        run: node scripts/timed-run.mjs browser-optimizer-full -- node scripts/fsrs-browser-optimizer-smoke.mjs chromium full
      - name: Upload smoke timing/failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-smoke-evidence
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  cross:
    name: Cross — browser-sensitive contracts (${{ matrix.browser }})
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      QA_TIMING_FILE: artifacts/qa-timing/cross-${{ matrix.browser }}.jsonl
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: node node_modules/playwright-core/cli.js install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@v4
        with:
          name: source-verified-offline-html
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: source-verified-static-app
          path: Practice_Desk_Static
      - name: Four cross-browser scenarios
        run: node scripts/timed-run.mjs browser-cross-${{ matrix.browser }} -- node scripts/acceptance-suite.mjs ${{ matrix.browser }} --tag=cross-browser
      - name: Browser/WASM optimizer probe
        run: node scripts/timed-run.mjs optimizer-probe-${{ matrix.browser }} -- node scripts/fsrs-browser-optimizer-smoke.mjs ${{ matrix.browser }}
      - name: Upload cross timing/failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-cross-${{ matrix.browser }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  deep:
    name: Deep — scale, mutations, parity and remaining Chromium risks
    if: github.event_name == 'push' && github.ref == 'refs/heads/working'
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_TIMING_FILE: artifacts/qa-timing/deep.jsonl
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Deep Node scale and benchmark contracts
        run: node scripts/timed-run.mjs deep-node -- npm run qa:deep
      - name: Ten targeted semantic mutations
        run: node scripts/timed-run.mjs targeted-mutations -- node scripts/mutation-sensitivity.mjs
      - name: Install isolated optimizer bindings
        run: npm ci --prefix tools/fsrs-optimizer --no-audit --no-fund
      - name: Native/WASM optimizer semantic parity
        run: node scripts/timed-run.mjs optimizer-parity -- npm run --prefix tools/fsrs-optimizer parity
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: source-verified-offline-html
          path: .
      - name: Eight deep Chromium scenarios
        run: node scripts/timed-run.mjs browser-deep -- node scripts/acceptance-suite.mjs chromium --tag=deep
      - name: Upload deep timing/failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-deep-evidence
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  equivalence:
    name: Temporary equivalence — legacy vs tagged (${{ matrix.browser }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/working'
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      QA_TIMING_FILE: artifacts/qa-timing/equivalence-${{ matrix.browser }}.jsonl
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: node node_modules/playwright-core/cli.js install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@v4
        with:
          name: source-verified-offline-html
          path: .
      - run: mkdir -p artifacts/equivalence
      - name: Legacy Pass-B browser manifest
        run: |
          node scripts/timed-run.mjs legacy-${{ matrix.browser }} -- node scripts/legacy-browser-suite.mjs ${{ matrix.browser }}
          cp artifacts/acceptance-modern/suite-${{ matrix.browser }}.json artifacts/equivalence/legacy-${{ matrix.browser }}.json
      - name: Tagged Pass-C browser registry
        run: |
          node scripts/timed-run.mjs tagged-${{ matrix.browser }} -- node scripts/acceptance-suite.mjs ${{ matrix.browser }}
          cp artifacts/acceptance-modern/suite-${{ matrix.browser }}.json artifacts/equivalence/new-${{ matrix.browser }}.json
      - name: Upload equivalence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equivalence-${{ matrix.browser }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  equivalence-audit:
    name: Temporary behavioural-equivalence audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/working'
    needs: equivalence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          pattern: equivalence-*
          path: artifacts
          merge-multiple: true
      - name: Compare legacy journeys to canonical browser/Node witnesses
        run: node scripts/browser-equivalence-audit.mjs artifacts/equivalence
      - uses: actions/upload-artifact@v4
        with:
          name: browser-equivalence-audit
          path: artifacts/equivalence/equivalence-audit.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish only after fast/smoke/cross/deep/equivalence gates pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/working'
    needs: [fast, smoke, cross, deep, equivalence-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: source-verified-offline-html
          path: .verified-build
      - name: Reject source drift and publish the tested HTML if needed
        shell: bash
        run: |
          set -euo pipefail
          verified_head="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$verified_head"
          test -s .verified-build/Practice_Desk_Offline_Mock_Tests.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          target_branch="${GITHUB_REF_NAME}"
          case "$target_branch" in
            working) ;;
            *) echo "::error::Unauthorized guarded publisher branch"; exit 1 ;;
          esac
          git fetch origin "$target_branch"
          remote_head=$(git rev-parse FETCH_HEAD)
          git merge-base --is-ancestor "$verified_head" "$remote_head" || {
            echo "::error::Branch diverged from tested source"; exit 1;
          }
          source_changes=$(git diff --name-only "$verified_head" "$remote_head" | grep -vE '\.md$' || true)
          test -z "$source_changes" || {
            echo "::error::Source, CI or artifact changed after testing: $source_changes"; exit 1;
          }
          cp .verified-build/Practice_Desk_Offline_Mock_Tests.html Practice_Desk_Offline_Mock_Tests.html
          if git diff --quiet -- Practice_Desk_Offline_Mock_Tests.html; then
            echo "Verified build matches committed offline HTML."
            exit 0
          fi
          git add Practice_Desk_Offline_Mock_Tests.html
          git commit -m 'build: refresh verified offline HTML [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin "$target_branch"
            remote_head=$(git rev-parse FETCH_HEAD)
            git merge-base --is-ancestor "$verified_head" "$remote_head" || {
              echo "::error::Branch diverged after testing"; exit 1;
            }
            source_changes=$(git diff --name-only "$verified_head" "$remote_head" | grep -vE '\.md$' || true)
            test -z "$source_changes" || {
              echo "::error::Unverified branch changes: $source_changes"; exit 1;
            }
            git rebase "$remote_head"
            if git push origin "HEAD:$target_branch"; then exit 0; fi
          done
          echo "::error::Could not safely publish tested HTML"; exit 1
