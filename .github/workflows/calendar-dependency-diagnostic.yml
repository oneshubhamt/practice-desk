name: Calendar dependency diagnostic
on:
  push:
    branches: [working]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - name: Generate canonical lock in scratch copy
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json /tmp/committed-lock.json
          rm package-lock.json
          npm install --package-lock-only --no-audit --no-fund
          node -e 'const p=require("./package-lock.json"); console.log(JSON.stringify({root:p.packages[""].dependencies["@director/calendar"],calendar:p.packages["node_modules/@director/calendar"]},null,2))'
          cp package-lock.json /tmp/generated-lock.json
          cp /tmp/committed-lock.json package-lock.json
      - name: Inspect committed-lock install
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          echo "CALENDAR DIRECTORY"
          find node_modules/@director/calendar -maxdepth 3 -type f -print | sort | head -80 || true
          echo "CALENDAR PACKAGE"
          cat node_modules/@director/calendar/package.json || true
          echo "DIST"
          find node_modules/@director/calendar/dist -maxdepth 2 -type f -print | head -40 || true
      - name: Show lock diff
        shell: bash
        run: |
          cp /tmp/generated-lock.json package-lock.json
          git diff -- package-lock.json || true
