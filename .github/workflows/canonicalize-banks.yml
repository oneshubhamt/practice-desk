name: One-time canonical bank materialization
on:
  push:
    branches: [working]
permissions:
  contents: write
concurrency:
  group: canonical-bank-materialization
  cancel-in-progress: true
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Materialize canonical packages without changing runtime topology
        run: node scripts/materialize-canonical-banks.mjs
      - name: Commit generated package bytes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- question-banks; then
            echo "Canonical package bytes already current."
            exit 0
          fi
          git add question-banks
          git commit -m 'content: materialize canonical exam packages [skip ci]'
          git fetch origin working
          test "$(git rev-parse HEAD^)" = "$(git rev-parse FETCH_HEAD)" || {
            echo "::error::Working moved during materialization"; exit 1;
          }
          git push origin HEAD:working
